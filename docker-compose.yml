services:
  db:
    image: postgres:16-alpine
    container_name: ore-del-mondo-db
    environment:
      POSTGRES_DB: ore_del_mondo
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarkus -d ore_del_mondo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ore-del-mondo-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/ore_del_mondo
      QUARKUS_DATASOURCE_USERNAME: quarkus
      QUARKUS_DATASOURCE_PASSWORD: quarkus
      JWT_SECRET: change-this-development-secret-with-at-least-32-chars
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      JSON_LOGS: "true"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
